<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calentamiento Maestro - IB Seniors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.3s ease-out forwards; }
    .match-selected { background-color: #e0f2fe !important; border-color: #0ea5e9 !important; border-width: 2px !important; }
    .matched { opacity: 0; pointer-events: none; transform: scale(0.9); transition: all 0.3s ease; }
    .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #0ea5e9; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div>
        <h1 id="pageTitle" class="text-lg font-black text-slate-800 uppercase tracking-tighter leading-tight cursor-pointer select-none">CONECTORES Y FORMATOS IB</h1>
        <div id="pageSubtitle" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
            <div class="spinner"></div> Sincronizando datos...
        </div>
      </div>
      <div class="w-40 sm:w-64 text-right">
        <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
          <div id="progress-fill" class="h-full bg-sky-500 transition-all duration-300 w-0"></div>
        </div>
        <p id="progress-label" class="text-[10px] text-slate-600 mt-1 font-bold uppercase font-mono tracking-widest">0%</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="grid md:grid-cols-[230px,1fr] gap-6">
      <aside class="space-y-4">
        
        <a href="https://sites.google.com/view/srscalici/vocabulario/conectores" target="_blank" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-md transition-all uppercase text-[10px] tracking-widest flex items-center justify-center gap-2">
            📖 Lista de Conectores
        </a>

        <div class="bg-white rounded-2xl shadow p-4 border border-slate-200 space-y-3">
          <div id="time-machine-container" class="hidden">
            <label class="text-[9px] font-black text-slate-400 uppercase mb-1 flex justify-between items-center tracking-widest text-center">
                SELECCIONAR DÍA <span id="unlock-badge" class="hidden text-amber-500 font-bold">🔓 PROFESOR</span>
            </label>
            <select id="day-select" class="w-full p-2 text-[10px] font-bold bg-slate-50 border rounded-lg outline-none cursor-pointer uppercase"></select>
          </div>
          <nav id="nav-tabs" class="space-y-1">
             </nav>
        </div>
      </aside>
      
      <section id="module-container" class="bg-white rounded-2xl shadow p-6 border border-slate-200 min-h-[550px] relative">
        <div id="module-content" class="flex justify-center items-center h-full">
            <p class="text-slate-400 text-sm font-medium animate-pulse">Obteniendo datos de GitHub...</p>
        </div>
      </section>
    </div>
  </main>

<script>
    const CALENDAR_URL = "https://raw.githubusercontent.com/scottscalici/imagenes/main/planes/calendario.json";
    const CONTENT_URL = "https://raw.githubusercontent.com/scottscalici/imagenes/main/planes/prueba1_calentamiento.json";
    
    let runtime = {
        activeDia: null,
        actualSchoolDay: null,
        db: null,
        currentModule: 1,
        completed: 0,
        ibState: { textType: false, regAud: false, conventions: 0 },
        teacherMode: false
    };

    let clickCount = 0;
    document.getElementById('pageTitle').addEventListener('click', () => {
        clickCount++;
        if (clickCount >= 5 && !runtime.teacherMode) {
            runtime.teacherMode = true;
            document.getElementById('unlock-badge').classList.remove('hidden');
            buildDropdown(); 
            clickCount = 0;
        }
        setTimeout(() => { clickCount = 0; }, 2000); 
    });

    async function init() {
        try {
            const cacheBuster = "?t=" + new Date().getTime();
            const [calRes, contentRes] = await Promise.all([
                fetch(CALENDAR_URL + cacheBuster),
                fetch(CONTENT_URL + cacheBuster)
            ]);

            const calendarData = await calRes.json();
            runtime.db = await contentRes.json();

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            
            const pastDays = calendarData.map
                .filter(d => d.fecha <= todayStr && d.dia !== null)
                .sort((a, b) => b.fecha.localeCompare(a.fecha));

            if (pastDays.length > 0) {
                runtime.actualSchoolDay = pastDays[0].dia.toString();
            } else {
                runtime.actualSchoolDay = "62"; 
            }

            const availableDays = Object.keys(runtime.db).map(Number).sort((a, b) => a - b);
            if (!runtime.db[runtime.actualSchoolDay]) {
                 const pastAvailable = availableDays.filter(d => d <= parseInt(runtime.actualSchoolDay));
                 if(pastAvailable.length > 0) {
                     runtime.actualSchoolDay = pastAvailable[pastAvailable.length-1].toString();
                 } else {
                     runtime.actualSchoolDay = availableDays[0].toString(); 
                 }
            }

            runtime.activeDia = runtime.actualSchoolDay;

            document.getElementById('time-machine-container').classList.remove('hidden');
            buildDropdown();
            
            const select = document.getElementById('day-select');
            select.onchange = (e) => loadDay(e.target.value);
            
            loadDay(runtime.activeDia);

        } catch (error) {
            console.error("Error loading data:", error);
            document.getElementById('module-content').innerHTML = `<div class="text-red-500 font-bold p-4 bg-red-50 rounded-xl border border-red-200">Error cargando los datos. Asegúrate de que las URLs de GitHub sean correctas.</div>`;
            document.getElementById('pageSubtitle').innerHTML = `<span class="text-red-500 font-bold">Error de conexión</span>`;
        }
    }

    function buildDropdown() {
        const select = document.getElementById('day-select');
        const availableDays = Object.keys(runtime.db).map(Number).sort((a, b) => a - b);
        
        let html = '';
        availableDays.forEach(dayNum => {
            const dStr = dayNum.toString();
            if (!runtime.teacherMode && dayNum > parseInt(runtime.actualSchoolDay)) {
                return; 
            }
            html += `<option value="${dStr}">Día ${dStr}: ${runtime.db[dStr].topic}</option>`;
        });
        
        select.innerHTML = html;
        select.value = runtime.activeDia;
    }

    function loadDay(dia) {
        runtime.activeDia = dia;
        runtime.completed = 0;
        runtime.ibState = { textType: false, regAud: false, conventions: 0 };
        
        document.getElementById('pageSubtitle').innerHTML = `<span class="text-sky-600 font-black tracking-widest">DÍA ${dia}</span> <span class="mx-2 text-slate-200">|</span> <span class="text-slate-500 font-bold">${runtime.db[dia].topic.toUpperCase()}</span>`;
        
        renderSidebar();
        showModule(1);
    }

    function renderSidebar() {
        const nav = document.getElementById('nav-tabs');
        const labels = ["1. Oraciones (A)", "2. Oraciones (B)", "3. Parejas", "4. Formato IB", "Listo"];
        nav.innerHTML = labels.map((l, i) => `
            <button onclick="showModule(${i+1})" class="module-tab w-full text-left px-3 py-2 rounded-lg flex items-center justify-between transition-all" id="tab-${i+1}" disabled>
                <span class="text-[10px] font-black uppercase tracking-tighter">${l}</span>
                <span id="badge-${i+1}">🔒</span>
            </button>
        `).join('');
    }

    function buildFillInTheBlank(sectionKey, moduleNum) {
        const sectionData = runtime.db[runtime.activeDia][sectionKey];
        
        // Shuffle the Word Bank
        const shuffledBanco = [...sectionData.banco].sort(() => 0.5 - Math.random());
        // Shuffle the Sentences
        const shuffledOraciones = [...sectionData.oraciones].sort(() => 0.5 - Math.random());

        let selectHTML = `<select class="connector-select border-b-2 border-sky-400 bg-sky-50 text-sky-800 font-bold px-2 py-1 mx-1 outline-none text-sm cursor-pointer appearance-none text-center">
                            <option value="">[ Selecciona ]</option>
                            ${shuffledBanco.map(w => `<option value="${w}">${w}</option>`).join('')}
                          </select>`;

        return `
            <div class="mb-6 border-b-2 border-sky-100 pb-2">
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">BANCO DE PALABRAS</h2>
                <p class="text-sm text-slate-500 font-medium mt-2">${shuffledBanco.join(' • ')}</p>
            </div>
            <div class="space-y-4 mb-6">
                ${shuffledOraciones.map((o, i) => {
                    const sentenceWithBlank = o.texto.replace('_', selectHTML);
                    return `
                    <div class="sentence-item p-4 bg-slate-50 border border-slate-200 rounded-xl flex items-center gap-3" data-ans="${o.respuesta}">
                        <span class="text-xs font-black text-slate-400">${i + 1}.</span>
                        <div class="text-slate-700 font-medium leading-loose text-sm w-full">${sentenceWithBlank}</div>
                    </div>`;
                }).join('')}
            </div>
            <div class="flex gap-2">
                <button onclick="checkSentences(${moduleNum})" class="px-6 py-3 bg-sky-600 text-white font-black rounded-xl text-xs uppercase tracking-widest transition-all hover:bg-sky-700 shadow-md">Revisar</button>
                <div id="next-btn-container-${moduleNum}"></div>
            </div>`;
    }

    function showModule(n) {
        runtime.currentModule = n;
        const content = document.getElementById('module-content');
        
        content.classList.remove('animate-pop');
        void content.offsetWidth; 
        content.classList.add('animate-pop');

        if (n === 1) {
            content.innerHTML = buildFillInTheBlank('oraciones_parte1', 1);
        } else if (n === 2) {
            content.innerHTML = buildFillInTheBlank('oraciones_parte2', 2);
        } else if (n === 3) {
            content.innerHTML = `
                <div class="mb-4 border-b-2 border-sky-100 pb-2 flex justify-between items-end">
                    <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">Encuentra la pareja</h2>
                    <span id="match-counter" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">0 / 10</span>
                </div>
                <div id="match-area" class="mt-4 p-6 bg-slate-50 rounded-2xl border border-slate-200"></div>
                <div id="next-btn-container-3" class="mt-6 flex justify-end"></div>`;
            startMatchingGame();
        } else if (n === 4) {
            renderIBModule(content);
        } else {
            content.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-4">🏆</div>
                    <h2 class="text-4xl font-black text-slate-800 mb-2 uppercase tracking-tighter">¡Excelente!</h2>
                    <p class="text-slate-500 font-medium mb-8">Estás preparadísimo para la Prueba 1.</p>
                </div>`;
        }
        updateProgress();
    }

    function checkSentences(moduleNum) {
        let correctCount = 0;
        const items = document.querySelectorAll('.sentence-item');
        
        items.forEach(item => {
            const select = item.querySelector('select');
            const ans = item.dataset.ans;
            select.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'border-red-400', 'bg-red-50', 'text-red-700');
            
            if (select.value === ans) {
                correctCount++;
                select.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            } else {
                select.classList.add('border-red-400', 'bg-red-50', 'text-red-700');
            }
        });

        if (correctCount === items.length) {
            runtime.completed = Math.max(runtime.completed, moduleNum);
            showNextButton(moduleNum);
            updateProgress();
        }
    }

    let selectedEs = null;
    let pairsSolved = 0;

    function startMatchingGame() {
        const area = document.getElementById('match-area');
        const pairs = runtime.db[runtime.activeDia].vocabulario;
        pairsSolved = 0;
        selectedEs = null;

        const shuffledEs = [...pairs].sort(() => 0.5 - Math.random());
        const shuffledEn = [...pairs].sort(() => 0.5 - Math.random());

        area.innerHTML = `
            <div class="grid grid-cols-2 gap-4">
                <div id="match-es" class="space-y-3"></div>
                <div id="match-en" class="space-y-3"></div>
            </div>`;

        shuffledEs.forEach(p => {
            const btn = document.createElement('button');
            btn.className = "w-full p-3 bg-white border-2 border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-sm transition-all hover:border-sky-300";
            btn.textContent = p.es;
            btn.onclick = () => {
                document.querySelectorAll('#match-es button').forEach(x => x.classList.remove('match-selected'));
                btn.classList.add('match-selected');
                selectedEs = p;
            };
            document.getElementById('match-es').appendChild(btn);
        });

        shuffledEn.forEach(p => {
            const btn = document.createElement('button');
            btn.className = "w-full p-3 bg-white border-2 border-dashed border-slate-300 rounded-xl text-sm text-slate-600 transition-all hover:bg-slate-50";
            btn.textContent = p.en;
            btn.onclick = () => {
                if (selectedEs && selectedEs.en === p.en) {
                    btn.classList.add('matched');
                    document.querySelectorAll('#match-es button').forEach(x => { 
                        if(x.textContent === selectedEs.es) x.classList.add('matched'); 
                    });
                    pairsSolved++;
                    document.getElementById('match-counter').textContent = `${pairsSolved} / 10`;
                    selectedEs = null;
                    
                    if (pairsSolved === pairs.length) {
                        runtime.completed = Math.max(runtime.completed, 3);
                        showNextButton(3);
                        updateProgress();
                        document.getElementById('match-area').innerHTML = `<div class="text-center text-emerald-500 font-black text-2xl py-8 animate-pop">¡PERFECTO!</div>`;
                    }
                } else if (selectedEs) {
                    btn.classList.add('border-red-400', 'bg-red-50');
                    setTimeout(() => btn.classList.remove('border-red-400', 'bg-red-50'), 500);
                }
            };
            document.getElementById('match-en').appendChild(btn);
        });
    }

    function renderIBModule(content) {
        const ib = runtime.db[runtime.activeDia].prueba_ib;
        content.innerHTML = `
            <div class="mb-4 border-b-2 border-indigo-100 pb-2">
                <h2 class="text-xl font-black text-indigo-900 uppercase tracking-tight">Práctica: Prueba 1</h2>
                <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mt-1">Análisis de Formato</p>
            </div>
            
            <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-xl mb-6 shadow-sm">
                <p class="text-sm text-indigo-900 leading-relaxed font-medium">"${ib.escenario}"</p>
            </div>

            <div id="ib-step-1">
                <p class="text-xs font-black text-slate-500 uppercase mb-3">1. Selecciona el Tipo de Texto adecuado:</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    ${ib.opciones_texto.map(op => `
                        <button onclick="checkIBTextType(this, '${op}')" class="ib-tt-btn w-full p-4 bg-white border-2 border-slate-200 rounded-xl text-sm font-bold text-slate-700 transition-all hover:bg-slate-50 shadow-sm">${op}</button>
                    `).join('')}
                </div>
            </div>

            <div id="ib-step-2" class="${runtime.ibState.textType ? '' : 'hidden'} mt-8 animate-pop border-t-2 border-slate-100 pt-6">
                <p class="text-xs font-black text-slate-500 uppercase mb-4">2. Define el Tono y la Audiencia:</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Registro</label>
                        <select id="ib-reg-select" class="w-full p-3 border-2 border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-400" ${runtime.ibState.regAud ? 'disabled' : ''}>
                            <option value="">[ Selecciona Registro ]</option>
                            ${[...ib.registro_opciones].sort().map(o => `<option value="${o}">${o}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Audiencia</label>
                        <select id="ib-aud-select" class="w-full p-3 border-2 border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-400" ${runtime.ibState.regAud ? 'disabled' : ''}>
                            <option value="">[ Selecciona Audiencia ]</option>
                            ${[...ib.audiencia_opciones].sort().map(o => `<option value="${o}">${o}</option>`).join('')}
                        </select>
                    </div>
                </div>
                ${!runtime.ibState.regAud ? `<button onclick="checkIBRegAud()" class="mt-4 px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg text-xs uppercase tracking-widest hover:bg-indigo-700 transition-all">Confirmar</button>` : ''}
                <p id="ib-reg-feedback" class="text-xs font-bold text-red-500 mt-2 hidden">Revisa tus selecciones.</p>
            </div>

            <div id="ib-step-3" class="${runtime.ibState.regAud ? '' : 'hidden'} mt-8 animate-pop border-t-2 border-slate-100 pt-6">
                <p class="text-xs font-black text-emerald-600 uppercase mb-3">3. Checklist de Convenciones</p>
                <p class="text-sm text-slate-500 mb-4">Para sacar la nota máxima, debes incluir estas convenciones. Marca cada una:</p>
                <div class="space-y-3">
                    ${ib.convenciones.map((conv, i) => `
                        <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="checkbox" onchange="checkIBConventions()" class="ib-conv-check w-5 h-5 rounded border-gray-300 text-emerald-500 focus:ring-emerald-500">
                            <span class="text-sm text-slate-700">${conv}</span>
                        </label>
                    `).join('')}
                </div>
                <div id="next-btn-container-4" class="mt-6 flex justify-end">
                    ${runtime.completed >= 4 ? `<button onclick="showModule(5)" class="btn-next px-8 py-3 bg-slate-800 text-white font-black rounded-xl text-xs uppercase tracking-widest shadow-lg hover:bg-slate-700 transition-all">Siguiente ➡</button>` : ''}
                </div>
            </div>
        `;
        
        if(runtime.ibState.textType) {
            document.querySelectorAll('.ib-tt-btn').forEach(b => {
               if(b.textContent === ib.texto_correcto) b.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700'); 
            });
        }
        if(runtime.ibState.regAud) {
             document.getElementById('ib-reg-select').value = ib.registro_correcto;
             document.getElementById('ib-aud-select').value = ib.audiencia_correcta;
             document.getElementById('ib-reg-select').classList.add('border-emerald-500');
             document.getElementById('ib-aud-select').classList.add('border-emerald-500');
        }
    }

    window.checkIBTextType = function(btn, selectedOption) {
        if (runtime.ibState.textType) return;
        const correct = runtime.db[runtime.activeDia].prueba_ib.texto_correcto;
        
        document.querySelectorAll('.ib-tt-btn').forEach(b => {
            b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'border-red-400', 'bg-red-50', 'text-red-700');
        });

        if (selectedOption === correct) {
            btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            runtime.ibState.textType = true;
            document.getElementById('ib-step-2').classList.remove('hidden');
        } else {
            btn.classList.add('border-red-400', 'bg-red-50', 'text-red-700');
        }
    };

    window.checkIBRegAud = function() {
        const regSelect = document.getElementById('ib-reg-select');
        const audSelect = document.getElementById('ib-aud-select');
        const feedback = document.getElementById('ib-reg-feedback');
        
        const ib = runtime.db[runtime.activeDia].prueba_ib;
        let isRegCorrect = regSelect.value === ib.registro_correcto;
        let isAudCorrect = audSelect.value === ib.audiencia_correcta;

        regSelect.classList.toggle('border-red-400', !isRegCorrect && regSelect.value !== "");
        regSelect.classList.toggle('border-emerald-500', isRegCorrect);
        audSelect.classList.toggle('border-red-400', !isAudCorrect && audSelect.value !== "");
        audSelect.classList.toggle('border-emerald-500', isAudCorrect);

        if (isRegCorrect && isAudCorrect) {
            feedback.classList.add('hidden');
            runtime.ibState.regAud = true;
            document.getElementById('ib-step-3').classList.remove('hidden');
            regSelect.disabled = true; audSelect.disabled = true;
            event.target.classList.add('hidden');
        } else {
            feedback.classList.remove('hidden');
        }
    };

    window.checkIBConventions = function() {
        const checkboxes = document.querySelectorAll('.ib-conv-check');
        let checkedCount = 0;
        checkboxes.forEach(cb => { if(cb.checked) checkedCount++; });
        
        if (checkedCount === checkboxes.length) {
            runtime.completed = Math.max(runtime.completed, 4);
            showNextButton(4);
            updateProgress();
        }
    };

    function showNextButton(currentModule) {
        const container = document.getElementById(`next-btn-container-${currentModule}`);
        if(container && !container.innerHTML.includes('Siguiente')) {
            container.innerHTML = `
                <button onclick="showModule(${currentModule + 1})" class="btn-next px-8 py-3 bg-slate-800 text-white font-black rounded-xl text-xs uppercase tracking-widest shadow-lg hover:bg-slate-700 transition-all">
                    Siguiente ➡
                </button>`;
        }
    }

    function updateProgress() {
        const totalModules = 5;
        const pct = Math.round((runtime.completed / (totalModules - 1)) * 100);
        document.getElementById('progress-fill').style.width = pct + "%";
        document.getElementById('progress-label').textContent = pct + "%";
        
        document.querySelectorAll('.module-tab').forEach((btn, i) => {
            const m = i + 1;
            if (m <= runtime.completed + 1) {
                btn.disabled = false;
                btn.className = `module-tab w-full text-left px-3 py-2 rounded-lg flex items-center justify-between transition-all ${m === runtime.currentModule ? 'bg-sky-50 text-sky-800 border-2 border-sky-300' : 'text-slate-500 hover:bg-slate-50 border-2 border-transparent'}`;
                document.getElementById(`badge-${m}`).textContent = m <= runtime.completed ? "✔" : "●";
            }
        });
    }

    init();
</script>
</body>
</html>
