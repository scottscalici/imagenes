<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>S2/S4 Teacher Planner Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
            body { background: white; padding: 0; }
            .planner-card { border: 1px solid #e2e8f0 !important; box-shadow: none !important; }
        }
        
        .planner-table th { @apply border border-slate-300 p-2 bg-slate-100 text-[10px] uppercase font-black; }
        .planner-table td { @apply border border-slate-300 p-2 text-sm; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

    <div class="no-print bg-white border-b shadow-sm p-6 mb-8">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center gap-4">
            <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Curso</label>
                <select id="courseSelect" class="border rounded px-3 py-2 font-bold text-slate-700">
                    <option value="s2">Español 2 (S2)</option>
                    <option value="s4">IB Español (S4)</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Día Inicial</label>
                <input type="number" id="startDia" value="61" class="border rounded px-3 py-2 w-24 font-bold">
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Días a Mostrar</label>
                <input type="number" id="dayRange" value="10" class="border rounded px-3 py-2 w-24 font-bold">
            </div>
            <div class="flex gap-2 self-end">
                <button onclick="fetchAllData()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded transition-colors">
                    Generar Planner
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-black text-white font-bold px-6 py-2 rounded transition-colors">
                    Imprimir 🖨️
                </button>
            </div>
        </div>
    </div>

    <div id="loading" class="hidden text-center p-20 font-bold text-slate-400 animate-pulse">Cargando datos desde GitHub...</div>

    <main id="plannerOutput" class="max-w-5xl mx-auto px-4 space-y-12">
        </main>

<script>
const REPO_URL = "https://raw.githubusercontent.com/scottscalici/imagenes/main/planes/";

// Safe extractor (matches your website's logic)
const extractItems = (dataObj) => {
    if (!dataObj) return [];
    if (Array.isArray(dataObj)) return dataObj;
    if (dataObj.items) return Array.isArray(dataObj.items) ? dataObj.items : Object.values(dataObj.items);
    return Object.values(dataObj).filter(v => typeof v === 'object');
};

async function fetchAllData() {
    const loader = document.getElementById('loading');
    const output = document.getElementById('plannerOutput');
    const course = document.getElementById('courseSelect').value;
    const start = parseInt(document.getElementById('startDia').value);
    const range = parseInt(document.getElementById('dayRange').value);
    
    loader.classList.remove('hidden');
    output.innerHTML = "";

    try {
        const safeFetch = url => fetch(url).then(r => r.ok ? r.json() : {}).catch(e => { console.warn('Fetch error:', url); return {}; });

        const [calRaw, evals, gram, curiosRaw, destRaw, musicaRaw, culturaRaw, convRaw, lecturaRaw, extrasRaw] = await Promise.all([
            safeFetch(REPO_URL + 'calendario.json'),
            safeFetch(REPO_URL + 'evaluaciones.json'),
            safeFetch(REPO_URL + 'gramatica_diaria.json'),
            safeFetch(REPO_URL + 'curiosidades.json'),
            safeFetch(REPO_URL + 'destacadodiario.json'),
            safeFetch(REPO_URL + 'musica.json'),
            safeFetch(REPO_URL + 'cultura.json'),
            safeFetch(REPO_URL + 'conversaciones.json'),
            safeFetch(REPO_URL + 'lectura.json'),
            safeFetch(REPO_URL + 'extras_diarios.json')
        ]);

        // Safely extract arrays
        const cal = extractItems(calRaw);
        const curios = extractItems(curiosRaw);
        const dest = extractItems(destRaw);
        const musica = extractItems(musicaRaw);
        const cultura = extractItems(culturaRaw);
        const conv = extractItems(convRaw);
        const lectura = extractItems(lecturaRaw);
        const extras = extractItems(extrasRaw);

        // 1. GENERAR TABLA LARGO PLAZO
        let tableHtml = `
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 planner-card">
                <h2 class="text-2xl font-black mb-4 uppercase text-slate-800 border-b-4 border-indigo-600 inline-block">Forecast: ${course.toUpperCase()} (Días ${start}-${start+range-1})</h2>
                <table class="w-full planner-table mt-4">
                    <thead>
                        <tr>
                            <th style="width: 80px">Día</th>
                            <th style="width: 200px">Fecha(s)</th>
                            <th>Evaluación</th>
                            <th>Gramática (Intro/Repaso)</th>
                        </tr>
                    </thead>
                    <tbody>`;

        for (let d = start; d < start + range; d++) {
            const dayEntries = cal.filter(c => c.dia == d);
            let dateStr = "";
            if (course === "s4") {
                const a = dayEntries.find(c => c.ciclo === "A")?.fecha || "";
                const b = dayEntries.find(c => c.ciclo === "B")?.fecha || "";
                dateStr = a && b ? `${a} / ${b}` : (a || b || "TBD");
            } else {
                dateStr = dayEntries.find(c => c.ciclo === "B")?.fecha || "TBD";
            }

            const evalLabel = evals.courses?.[course]?.find(e => e.dia == d)?.label || "—";
            const gramIntro = gram[course]?.[d]?.intro?.join(", ") || "";
            const gramRepaso = gram[course]?.[d]?.repaso?.join(", ") || "";
            
            let gramFull = [];
            if (gramIntro) gramFull.push(`<b>Intro:</b> ${gramIntro}`);
            if (gramRepaso) gramFull.push(`<b>Repaso:</b> ${gramRepaso}`);

            tableHtml += `<tr>
                <td class="font-bold text-center text-lg">${d}</td>
                <td class="text-xs">${dateStr}</td>
                <td class="font-medium text-red-600">${evalLabel}</td>
                <td class="text-xs">${gramFull.join("<br>") || "—"}</td>
            </tr>`;
        }
        tableHtml += `</tbody></table></section>`;

        // 2. GENERAR PLANES DIARIOS DETALLADOS
        let detailHtml = "";
        for (let d = start; d < start + range; d++) {
            const curiosidad = curios.find(c => c[course + "_dia"] == d);
            const destacado = dest.find(h => h.dia == d && h.course?.includes(course));
            
            // Re-using your exact logic to find if content is scheduled for today
            const isTodayForCourse = (item) => {
                if (!item) return false;
                const courseKey = course + "_dias";
                const matchesA = item[courseKey] && item[courseKey].includes(d);
                const matchesB = item.courses && item.courses.includes(course) && item.dias && item.dias.includes(d);
                return matchesA || matchesB;
            };

            const dayMusica = musica.filter(isTodayForCourse);
            const dayCultura = cultura.filter(isTodayForCourse);
            const dayConv = conv.filter(isTodayForCourse);
            const dayLectura = lectura.filter(isTodayForCourse);
            const dayExtras = extras.filter(isTodayForCourse);

            detailHtml += `
                <div class="page-break bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-6 planner-card mt-8">
                    <div class="flex justify-between items-center border-b-2 pb-4">
                        <h2 class="text-4xl font-black uppercase text-indigo-900">Día ${d} <span class="text-xl font-normal text-slate-400">| ${course.toUpperCase()}</span></h2>
                        <div class="text-right text-[10px] font-bold text-slate-400 uppercase tracking-widest">Teacher Daily Planner</div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <h3 class="text-xs font-black uppercase text-slate-400 mb-2">Instrucción</h3>
                            <div class="bg-slate-50 p-4 rounded-lg border italic text-sm">
                                <b>Gramática:</b> ${gram[course]?.[d]?.intro?.join(", ") || "N/A"}<br><br>
                                <b>Práctica:</b> ${gram[course]?.[d]?.repaso?.join(", ") || "N/A"}
                            </div>
                        </div>
                        <div>
                            <h3 class="text-xs font-black uppercase text-slate-400 mb-2">Evaluación del Día</h3>
                            <div class="bg-red-50 p-4 rounded-lg border border-red-100 font-bold text-red-700">
                                ${evals.courses?.[course]?.find(e => e.dia == d)?.label || "No hay evaluaciones"}
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div class="border p-4 rounded-lg ${curiosidad ? 'bg-yellow-50' : 'bg-slate-50'}">
                            <h4 class="font-black text-[9px] uppercase mb-1">Curiosidad</h4>
                            <p class="text-xs ${curiosidad ? 'font-bold' : 'text-slate-400 italic'}">${curiosidad ? curiosidad.title : '—'}</p>
                        </div>
                        <div class="border p-4 rounded-lg ${destacado ? 'bg-blue-50' : 'bg-slate-50'}">
                            <h4 class="font-black text-[9px] uppercase mb-1 ${destacado ? 'text-blue-600' : ''}">Palabra del Día</h4>
                            <p class="text-sm ${destacado ? 'font-black' : 'text-slate-400 italic'}">${destacado ? destacado.word_of_the_day.word : '—'}</p>
                        </div>
                        <div class="border p-4 rounded-lg ${dayMusica.length ? 'bg-green-50' : 'bg-slate-50'}">
                            <h4 class="font-black text-[9px] uppercase mb-1 ${dayMusica.length ? 'text-green-600' : ''}">Música</h4>
                            <p class="text-xs ${dayMusica.length ? 'font-bold' : 'text-slate-400 italic'}">${dayMusica.length ? (dayMusica[0].titulo || dayMusica[0].title) : '—'}</p>
                        </div>
                    </div>

                    <div class="pt-4 border-t">
                        <h3 class="text-xs font-black uppercase text-slate-400 mb-2">Actividades de Clase</h3>
                        <ul class="text-sm space-y-2">
                            ${dayCultura.map(c => `<li>• <b>Cultura:</b> ${c.titulo || c.title}</li>`).join('')}
                            ${dayLectura.map(l => `<li>• <b>Lectura:</b> ${l.titulo || l.title}</li>`).join('')}
                            ${dayExtras.map(e => `<li>• <b>Extra:</b> ${e.title}</li>`).join('')}
                            ${dayConv.map(c => `<li>• <b>Conversación:</b> ${c.titulo || c.title}</li>`).join('')}
                            ${(!dayCultura.length && !dayLectura.length && !dayExtras.length && !dayConv.length) ? '<li class="text-slate-400 italic">No hay actividades extra programadas.</li>' : ''}
                        </ul>
                    </div>
                </div>`;
        }

        output.innerHTML = tableHtml + detailHtml;
    } catch (e) {
        output.innerHTML = `<div class="text-red-500 font-bold p-10 border-2 border-red-200 rounded bg-white">Error interno al procesar los datos. Revisa la consola para más detalles.</div>`;
        console.error(e);
    } finally {
        loader.classList.add('hidden');
    }
}
</script>
</body>
</html>
