<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Señor Stream - FYP</title>

  <style>
    /* --- CSS ESTILOS --- */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #121212;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #app-window {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 9 / 16; 
      max-height: 85vh;     
      background-color: #000;
      border-radius: 24px;
      overflow: hidden; 
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 4px solid #333;
    }

    .stream-header {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
      pointer-events: none; 
    }

    .stream-header h2 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .fyp-tab {
      font-size: 0.9rem;
      font-weight: bold;
      margin-top: 2px;
      opacity: 0.9;
    }

    .fyp-tab span {
      font-size: 0.7rem;
      font-weight: normal;
      opacity: 0.8;
    }

    #scroll-track {
      height: 200%; 
      width: 100%;
      transition: transform 0.5s ease-in-out; 
    }

    .video-slot {
      height: 50%; 
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background-color: #000; 
      position: relative;
    }

    .animating-up { transform: translateY(-50%); }
    .no-transition { transition: none !important; }

    #next-btn {
      margin-top: 25px;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #e50914; 
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(229, 9, 20, 0.4);
      transition: transform 0.1s;
      z-index: 20;
    }

    #next-btn:active { transform: scale(0.95); }
    .loading-text { color: #fff; font-size: 1.2rem; }
  </style>
</head>
<body>

  <div id="app-window">
    <div class="stream-header">
      <h2>Señor Stream</h2>
      <div class="fyp-tab">FYP <span>(Fluidez y Práctica)</span></div>
    </div>

    <div id="scroll-track">
      <div id="slot-a" class="video-slot">
        <p class="loading-text">Cargando...</p>
      </div>
      <div id="slot-b" class="video-slot"></div>
    </div>
  </div>

  <button id="next-btn">Siguiente ⬇</button>

  <script>
    /* --- JAVASCRIPT LÓGICA --- */

    let videoDatabase = []; 
    // Connected to your automated Apps Script Folder
    const jsonUrl = "https://script.google.com/macros/s/AKfycbyL_siaRKlrOAtyrbE5v-53PH0gRJDhS9LFEAdUH3zB3czS10DzGc6tlwo7YovNBoGi/exec";

    const scrollTrack = document.getElementById('scroll-track');
    const slotA = document.getElementById('slot-a');
    const slotB = document.getElementById('slot-b');
    const nextBtn = document.getElementById('next-btn');
    const appWindow = document.getElementById('app-window');

    let isAnimating = false; 

    async function loadVideos() {
      try {
        const response = await fetch(jsonUrl + '?v=' + new Date().getTime());
        if (!response.ok) throw new Error("Could not load the JSON file.");
        videoDatabase = await response.json();
        init(); 
      } catch (error) {
        console.error("Error loading FYP database:", error);
        slotA.innerHTML = `<p style="color:white;">Error loading videos. Check console.</p>`;
      }
    }

    function getEmbedHTML(videoObj) {
      let finalId = videoObj.video_id || "";
      let embedCode = "";

      if (videoObj.url) {
        if (videoObj.platform === "youtube") {
          const ytMatch = videoObj.url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]{11})/);
          finalId = ytMatch ? ytMatch[1] : videoObj.url;
        } else if (videoObj.platform === "tiktok") {
          const ttMatch = videoObj.url.match(/video\/(\d+)/);
          finalId = ttMatch ? ttMatch[1] : videoObj.url;
        } else if (videoObj.platform === "instagram") {
          const igMatch = videoObj.url.match(/(?:reel|p)\/([a-zA-Z0-9_-]+)/);
          finalId = igMatch ? igMatch[1] : videoObj.url;
        }
      }

      if (videoObj.platform === "youtube") {
        let timeParams = "";
        if (videoObj.start) timeParams += `&start=${videoObj.start}`;
        if (videoObj.end) timeParams += `&end=${videoObj.end}`;
        embedCode = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${finalId}?autoplay=1&mute=1&playsinline=1${timeParams}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      } 
      else if (videoObj.platform === "tiktok") {
        embedCode = `<iframe width="100%" height="100%" src="https://www.tiktok.com/embed/v2/${finalId}" frameborder="0" scrolling="no" allow="fullscreen; autoplay; encrypted-media;" allowfullscreen></iframe>`;
      } 
      else if (videoObj.platform === "instagram") {
        embedCode = `<iframe width="100%" height="100%" src="https://www.instagram.com/reel/${finalId}/embed/" frameborder="0" scrolling="no" allowtransparency="true" allowfullscreen></iframe>`;
      } 
      else if (videoObj.platform === "facebook") {
        const encodedUrl = encodeURIComponent(videoObj.url || "");
        embedCode = `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=false&width=auto" width="100%" height="100%" style="border:none; overflow:hidden;" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
      } 
      // THE NATIVE GOOGLE DRIVE PLAYER
      else if (videoObj.platform === "drive") {
        embedCode = `
          <iframe width="100%" height="100%" 
            src="https://drive.google.com/file/d/${finalId}/preview" 
            frameborder="0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
          </iframe>
        `;
      } 
      else {
        embedCode = `<p style="color:white;">Plataforma no soportada</p>`;
      }

      return embedCode;
    }

    function init() {
      if (videoDatabase.length === 0) return;
      const firstVideo = videoDatabase[Math.floor(Math.random() * videoDatabase.length)];
      slotA.innerHTML = getEmbedHTML(firstVideo);
    } 

    function advanceFeed() {
      if (isAnimating || videoDatabase.length === 0) return; 
      isAnimating = true;

      const nextVideo = videoDatabase[Math.floor(Math.random() * videoDatabase.length)];
      slotB.innerHTML = getEmbedHTML(nextVideo);

      scrollTrack.classList.add('animating-up');

      setTimeout(() => {
        scrollTrack.classList.add('no-transition');
        slotA.innerHTML = slotB.innerHTML;
        slotB.innerHTML = ''; 
        scrollTrack.classList.remove('animating-up');
        void scrollTrack.offsetWidth; 
        scrollTrack.classList.remove('no-transition');
        isAnimating = false;
      }, 500);
    }

    nextBtn.addEventListener('click', advanceFeed);

    let touchStartY = 0;
    let touchEndY = 0;

    appWindow.addEventListener('touchstart', (e) => {
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    appWindow.addEventListener('touchend', (e) => {
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchStartY - touchEndY;
      if (swipeDistance > 60) {
        advanceFeed();
      }
    }

    loadVideos();
  </script>
</body>
</html>
